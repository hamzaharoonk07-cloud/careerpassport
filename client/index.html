<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060911" />

    <!-- Vector first, so the mark stays crisp at every tab, bookmark and
         pinned size from one file. The PNGs are for what the SVG does not
         reach: older browsers that ignore an SVG favicon, and iOS, which
         wants a square raster for a home-screen bookmark and will otherwise
         screenshot the page. Regenerate both with tools/make-favicons.mjs
         whenever favicon.svg changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="PathSeeker. Discover the career that fits you, and the road that gets you there."
    />
    <title>PathSeeker — Career Passport</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Inter:wght@400..700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
